<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>AI Hub — All-in-One AI Workspace</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;height:100vh;overflow:hidden}
  #sidebar{width:220px;background:#1e293b;border-right:1px solid #334155;display:flex;flex-direction:column;flex-shrink:0}
  #sidebar-header{padding:16px 14px 8px;border-bottom:1px solid #334155}
  #sidebar-header h1{font-size:18px;font-weight:700;background:linear-gradient(90deg,#a78bfa,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  #sidebar-header p{font-size:11px;color:#64748b;margin-top:2px}
  #tab-list{padding:10px 8px;flex:1;overflow-y:auto}
  .tab-btn{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border-radius:8px;border:none;cursor:pointer;font-size:13px;background:transparent;color:#94a3b8;border-left:3px solid transparent;margin-bottom:2px;text-align:left;transition:all 0.2s}
  .tab-btn.active{background:rgba(124,58,237,0.2);color:#a78bfa;border-left:3px solid #7c3aed;font-weight:600}
  .tab-btn:hover:not(.active){background:#0f172a}
  .tab-badge{margin-left:auto;font-size:10px;background:#7c3aed;color:#fff;border-radius:10px;padding:1px 6px}
  #model-box{padding:12px;border-top:1px solid #334155}
  #model-box label{font-size:11px;color:#64748b;display:block;margin-bottom:6px}
  #model-select{width:100%;font-size:11px;padding:5px 6px;border-radius:6px;background:#0f172a;color:#94a3b8;border:1px solid #334155}
  #main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  #topbar{padding:10px 16px;border-bottom:1px solid #334155;display:flex;align-items:center;gap:10px;background:#1e293b;flex-shrink:0}
  #menu-btn{background:none;border:none;color:#64748b;cursor:pointer;font-size:18px}
  #topbar-title{font-size:15px;font-weight:600}
  #topbar-actions{margin-left:auto;display:flex;gap:8px}
  .action-btn{font-size:11px;padding:4px 10px;border-radius:6px;background:transparent;border:1px solid #334155;color:#94a3b8;cursor:pointer}
  #messages{flex:1;overflow-y:auto;padding:16px 20px}
  .empty-state{text-align:center;margin-top:40px}
  .empty-icon{font-size:40px;margin-bottom:12px}
  .empty-title{font-size:18px;font-weight:600;margin-bottom:6px}
  .empty-sub{font-size:13px;color:#64748b;margin-bottom:24px}
  .quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:480px;margin:0 auto}
  .quick-btn{padding:10px 12px;border-radius:10px;font-size:12px;text-align:left;cursor:pointer;background:#1e293b;border:1px solid #334155;color:#cbd5e1;line-height:1.4}
  .quick-btn:hover{background:#334155}
  .msg-row{display:flex;gap:10px;margin-bottom:16px;align-items:flex-start}
  .msg-row.user{flex-direction:row-reverse}
  .avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:600}
  .avatar.user{background:linear-gradient(135deg,#7c3aed,#4f46e5)}
  .avatar.ai{background:linear-gradient(135deg,#0ea5e9,#06b6d4)}
  .bubble{max-width:80%;position:relative}
  .bubble-text{border-radius:4px 18px 18px 18px;padding:10px 14px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:#fff;background:#1e293b}
  .msg-row.user .bubble-text{border-radius:18px 4px 18px 18px;background:linear-gradient(135deg,#7c3aed,#4f46e5)}
  .copy-btn{margin-top:4px;font-size:11px;padding:2px 8px;border-radius:6px;background:transparent;border:1px solid #334155;color:#94a3b8;cursor:pointer}
  .typing{display:flex;gap:4px;align-items:center;padding:10px 0}
  .dot{width:8px;height:8px;border-radius:50%;background:#7c3aed;animation:bounce 1.2s infinite}
  .dot:nth-child(2){animation-delay:.2s}
  .dot:nth-child(3){animation-delay:.4s}
  @keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
  #input-area{padding:12px 16px;border-top:1px solid #334155;background:#1e293b;flex-shrink:0}
  #input-box{display:flex;gap:8px;align-items:flex-end;background:#0f172a;border:1px solid #334155;border-radius:14px;padding:8px 12px}
  #user-input{flex:1;background:none;border:none;outline:none;color:#e2e8f0;font-size:14px;resize:none;max-height:120px;line-height:1.5;font-family:inherit;padding:0}
  #send-btn{padding:7px 16px;border-radius:10px;border:none;cursor:pointer;font-size:13px;font-weight:600;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;flex-shrink:0}
  #send-btn:disabled{background:#334155;color:#64748b;cursor:not-allowed}
  #footer-note{font-size:11px;color:#475569;margin-top:6px;text-align:center}
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h1>⚡ AI Hub</h1>
    <p>All-in-One AI Workspace</p>
  </div>
  <div id="tab-list"></div>
  <div id="model-box">
    <label>Model</label>
    <select id="model-select">
      <option>Claude Sonnet 4</option>
      <option>DeepSeek (via Claude)</option>
      <option>GPT-style (via Claude)</option>
      <option>Nano-style (via Claude)</option>
    </select>
  </div>
</div>

<div id="main">
  <div id="topbar">
    <button id="menu-btn" onclick="toggleSidebar()">☰</button>
    <span id="topbar-title">💬 AI Chat</span>
    <div id="topbar-actions">
      <button class="action-btn" onclick="exportChat()">⬇ Export</button>
      <button class="action-btn" onclick="clearChat()">🗑 Clear</button>
    </div>
  </div>
  <div id="messages"></div>
  <div id="input-area">
    <div id="input-box">
      <textarea id="user-input" rows="1" placeholder="Type your message... (Enter to send, Shift+Enter for new line)"></textarea>
      <button id="send-btn" onclick="sendMessage()">Send ➤</button>
    </div>
    <div id="footer-note">Free · Unlimited · Powered by Claude AI</div>
  </div>
</div>

<script>
const TABS = [
  {id:"chat", label:"AI Chat", icon:"💬"},
  {id:"image", label:"Image AI", icon:"🎨"},
  {id:"video", label:"Video AI", icon:"🎬"},
  {id:"code", label:"Code AI", icon:"💻"},
  {id:"write", label:"Writing AI", icon:"✍️"},
  {id:"web", label:"Web Builder", icon:"🌐"},
];

const SYSTEM_PROMPTS = {
  chat:"You are a helpful, friendly AI assistant. Answer clearly and helpfully.",
  image:"You are an expert AI image prompt engineer. When the user describes what they want, generate 3 highly detailed, professional image prompts optimized for AI image generators like Midjourney, DALL-E, or Stable Diffusion. Format each prompt clearly numbered.",
  video:"You are an expert AI video director. Generate detailed video prompts, scripts, and shot lists for AI video tools like Runway, Kling, or Pika. Include scene descriptions, camera movements, lighting, and mood.",
  code:"You are an expert full-stack developer. Write clean, well-commented, production-ready code. Always explain what the code does.",
  write:"You are a professional content writer and copywriter. Produce high-quality, engaging content tailored to the user's needs.",
  web:"You are an expert web developer. When asked to build a website, generate complete, modern HTML/CSS/JS code that can be copied and used directly. Make it responsive and beautiful.",
};

const QUICK_PROMPTS = {
  chat:["Explain quantum computing simply","Give me 10 business ideas","Write a motivational speech","What are today's AI trends?"],
  image:["Cinematic sunset over futuristic city","Portrait of a wise old wizard","Abstract neon art digital painting","Photorealistic product on white background"],
  video:["Short film intro scene","YouTube explainer video script","Instagram reel for a product","Cinematic drone shot sequence"],
  code:["Build a REST API in Python","React dashboard with charts","Login page with authentication","Web scraper in JavaScript"],
  write:["Blog post about AI in 2025","Product description for headphones","Cold email for SaaS","LinkedIn bio for a developer"],
  web:["Landing page for a startup","Portfolio website for a designer","E-commerce product page","SaaS pricing page"],
};

let currentTab = "chat";
let histories = {chat:[],image:[],video:[],code:[],write:[],web:[]};
let loading = false;
let sidebarVisible = true;

function init() {
  const tabList = document.getElementById("tab-list");
  TABS.forEach(t => {
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (t.id === currentTab ? " active" : "");
    btn.id = "tab-" + t.id;
    btn.innerHTML = `<span>${t.icon}</span> ${t.label}`;
    btn.onclick = () => switchTab(t.id);
    tabList.appendChild(btn);
  });
  renderMessages();

  const inp = document.getElementById("user-input");
  inp.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  inp.addEventListener("input", () => {
    inp.style.height = "auto";
    inp.style.height = Math.min(inp.scrollHeight, 120) + "px";
  });
}

function switchTab(id) {
  currentTab = id;
  TABS.forEach(t => {
    const btn = document.getElementById("tab-" + t.id);
    btn.className = "tab-btn" + (t.id === id ? " active" : "");
  });
  const t = TABS.find(x => x.id === id);
  document.getElementById("topbar-title").textContent = t.icon + " " + t.label;
  document.getElementById("user-input").placeholder = `Ask ${t.label}... (Enter to send)`;
  renderMessages();
}

function toggleSidebar() {
  sidebarVisible = !sidebarVisible;
  document.getElementById("sidebar").style.display = sidebarVisible ? "flex" : "none";
}

function renderMessages() {
  const msgs = histories[currentTab];
  const container = document.getElementById("messages");
  if (msgs.length === 0) {
    const t = TABS.find(x => x.id === currentTab);
    const qp = QUICK_PROMPTS[currentTab].map(p =>
      `<button class="quick-btn" onclick="sendMessage('${p.replace(/'/g,"\\'")}')">${p}</button>`
    ).join("");
    container.innerHTML = `<div class="empty-state">
      <div class="empty-icon">${t.icon}</div>
      <div class="empty-title">${t.label}</div>
      <div class="empty-sub">Powered by Claude AI · Free & Unlimited</div>
      <div class="quick-grid">${qp}</div>
    </div>`;
    return;
  }
  container.innerHTML = "";
  msgs.forEach(m => {
    const row = document.createElement("div");
    row.className = "msg-row " + m.role;
    const av = document.createElement("div");
    av.className = "avatar " + (m.role === "user" ? "user" : "ai");
    av.textContent = m.role === "user" ? "U" : "AI";
    const bub = document.createElement("div");
    bub.className = "bubble";
    const bt = document.createElement("div");
    bt.className = "bubble-text";
    bt.textContent = m.content;
    bub.appendChild(bt);
    if (m.role === "assistant") {
      const cb = document.createElement("button");
      cb.className = "copy-btn";
      cb.textContent = "Copy";
      cb.onclick = () => { navigator.clipboard.writeText(m.content); cb.textContent = "✓ Copied"; setTimeout(() => cb.textContent = "Copy", 1500); };
      bub.appendChild(cb);
    }
    row.appendChild(av);
    row.appendChild(bub);
    container.appendChild(row);
  });
  if (loading) {
    const row = document.createElement("div");
    row.className = "msg-row";
    row.innerHTML = `<div class="avatar ai">AI</div><div class="bubble"><div class="bubble-text"><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div></div>`;
    container.appendChild(row);
  }
  container.scrollTop = container.scrollHeight;
}

function updateBadge(tab) {
  const btn = document.getElementById("tab-" + tab);
  const count = Math.ceil(histories[tab].length / 2);
  let badge = btn.querySelector(".tab-badge");
  if (count > 0) {
    if (!badge) { badge = document.createElement("span"); badge.className = "tab-badge"; btn.appendChild(badge); }
    badge.textContent = count;
  } else if (badge) badge.remove();
}

async function sendMessage(text) {
  const inp = document.getElementById("user-input");
  const msg = text || inp.value.trim();
  if (!msg || loading) return;
  inp.value = ""; inp.style.height = "auto";
  loading = true;
  document.getElementById("send-btn").disabled = true;
  histories[currentTab].push({ role:"user", content:msg });
  renderMessages();
  try {
    const msgs = histories[currentTab].map(m => ({ role:m.role, content:m.content }));
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
  method:"POST",
  headers:{
    "Content-Type":"application/json",
    "Authorization":"Bearer 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"
  },
  body:JSON.stringify({
    model:"llama3-70b-8192",
    max_tokens:1500,
    messages:[
      {role:"system", content:SYSTEM_PROMPTS[currentTab]},
      ...msgs
    ]
  })
});
const data = await res.json();
const reply = data.choices?.[0]?.message?.content || "Sorry, could not get a response.";
    histories[currentTab].push({ role:"assistant", content:reply });
  } catch {
    histories[currentTab].push({ role:"assistant", content:"⚠️ Error connecting to AI. Please check your internet connection." });
  }
  loading = false;
  document.getElementById("send-btn").disabled = false;
  updateBadge(currentTab);
  renderMessages();
}

function clearChat() {
  histories[currentTab] = [];
  updateBadge(currentTab);
  renderMessages();
}

function exportChat() {
  const text = histories[currentTab].map(m => m.role.toUpperCase() + ": " + m.content).join("\n\n");
  if (!text) return alert("Nothing to export yet!");
  const blob = new Blob([text], {type:"text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = currentTab + "-chat.txt";
  a.click();
}

init();
</script>
</body>
</html>
